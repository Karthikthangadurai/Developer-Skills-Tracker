<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awasome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="main-content">
      
      <div class="heading">
        <div class="hidden">   
        </div>
        <div>
          <h1>Developer Skills Tracker</h1>
          <p>Manage your technical skills</p>
        </div>
        <div>
          <button type="button" id="darkModeBtn"><i class="fa-solid fa-moon"></i> <span id="modeLabel">Dark Mode</span></button>
        </div>
      </div>

      <div class="skill-controls">
        <form id="skillForm">
          <label for="skillInput">Add a skill</label><br><br>

          <input
            type="text"
            id="skillInput"
            placeholder="Enter your skill..."
          />
          <button type="submit">+ Add Skill</button>
        </form>

        <label for="searchInput">Search skills</label><br>
        <input
          type="search"
          id="searchInput"
          placeholder="Search your skills..."
        />
      </div>

      <p id="totalCount">Total Skills: 8</p>

      <div class="container" id="skillsContainer">
      
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
